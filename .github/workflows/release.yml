name: Publish Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release and APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "乐词背单词 ${GITHUB_REF_NAME}" \
            --generate-notes \
            "乐词背单词-${GITHUB_REF_NAME}.apk#乐词背单词 Android APK"
